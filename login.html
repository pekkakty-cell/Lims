<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <title>로그인 - 랩데이터통합관리</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

<div class="login-wrap">
  <div class="login-card">
    <div class="login-brand">🧪</div>
    <h1 class="login-title">랩데이터통합관리</h1>

    <div class="login-error" id="login-error" style="display:none;"></div>

    <label class="login-field-label">ID</label>
    <input type="text" id="login-id-input" class="login-input" autocomplete="username">

    <label class="login-field-label">Password</label>
    <input type="password" id="login-pw-input" class="login-input" autocomplete="current-password">

    <label class="login-remember">
      <input type="checkbox" id="login-remember-checkbox"> 아이디 저장
    </label>

    <button id="login-submit-btn" class="login-submit-btn">로그인</button>

    <div class="login-links">
      <a href="#">ID/PW 분실 &amp; 변경 문의</a>
      <a href="#">시스템 이용 안내</a>
    </div>
  </div>

  <div class="login-footer">
    <span>접속 IP: 127.0.0.1</span>
    <span>© LIMS Clone (연습용)</span>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
