<!doctype html>
<html lang="ko">

<head>

      window.location.href = "login.html";
    }
  </script>
  <title>공급사 Audit</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
<header>
  <div class="logo">랩데이터통합관리 LIMS</div>
  <div class="right-group">

      <a href="#">자원관리</a>
      <a href="#">현황</a>
    </nav>
    <div class="header-icons">
      <div class="dropdown-wrap">
        <button class="icon-badge">🔔<span class="badge blue">0</span></button>
        <div class="dropdown-menu">
          <div class="dropdown-item">✔ 작업중인시험</div>
          <a href="incoming-inspection.html" class="dropdown-link">수입검사 더보기 →</a>
          <a href="product-inspection.html" class="dropdown-link">제품검사 더보기 →</a>
        </div>
      </div>

      <div class="dropdown-wrap">
        <button class="icon-badge">📋<span class="badge green">0</span></button>
        <div class="dropdown-menu">
          <div class="dropdown-item">✔ 고객응답대기 출하성적서</div>
          <a href="shipment-certificate.html" class="dropdown-link">출하성적서 더보기 →</a>
        </div>
      </div>
    </div>
    <button class="toggle-off">⏻ OFF</button>
    <div class="dropdown-wrap">
      <button class="user-menu">
        <span class="avatar"></span>
        <span class="user-info">품질팀 · 품질팀</span>
        <span class="user-caret">▾</span>
      </button>
      <div class="dropdown-menu user-dropdown-menu">
        <div class="dropdown-item">🕐 로그아웃까지 95:52</div>
        <a href="#" class="dropdown-link">👤 정보수정</a>

        <a href="#" class="dropdown-link">❓ 시스템 정보</a>
        <a href="#" class="dropdown-link">⏻ Logout</a>
      </div>
    </div>
  </div>
</header>

<div class="nav-mega-menu" id="nav-mega-menu"></div>

<div class="breadcrumb">
  🏠 Home &gt; 공급사 Audit
</div>

<div class="tabs"></div>

<div class="title-bar">
  <h2>공급사 Audit</h2>
  <div class="title-actions">
    <div class="buttons">
      <button id="audit-search-btn">검색</button>
      <button id="audit-add-btn">+ 추가</button>
      <button id="audit-excel-btn">엑셀출력</button>
    </div>
    <div class="select-group">
      선택:
      <button class="select-icon" title="새로생성[New]">📊</button>
      <button class="select-icon" title="체크인">📄</button>
      <button class="select-icon" title="승인완료">☑️</button>
    </div>
  </div>
</div>

<div class="search-bar">
  <input type="text" placeholder="ID" id="audit-search-id">
  <input type="text" placeholder="명칭" id="audit-search-name">

  <div class="search-select" id="status-select">
    <button type="button" class="search-select-trigger">상태</button>
    <div class="search-select-menu">
      <div class="search-select-search">
        <input type="text" class="search-select-search-input" placeholder="🔍">
      </div>
      <div class="search-select-options">
        <div class="search-select-option" data-value="상태">상태</div>
        <div class="search-select-option" data-value="진행중">진행중</div>
        <div class="search-select-option" data-value="완료">완료</div>
        <div class="search-select-option" data-value="검증대기">검증대기</div>
      </div>
    </div>
  </div>

  <div class="search-select" id="date-field-select">
    <button type="button" class="search-select-trigger">날짜선택</button>
    <div class="search-select-menu">
      <div class="search-select-options">
        <div class="search-select-option" data-value="날짜선택">날짜선택</div>
        <div class="search-select-option" data-value="생성일">생성일</div>
        <div class="search-select-option" data-value="수정일">수정일</div>
      </div>
    </div>
  </div>

  <div class="date-input">
    <input type="text" placeholder="From" id="from-input">
    <button class="icon-btn" id="from-date">📅</button>
    <button class="icon-btn" id="from-time">🕐</button>
  </div>

  <div class="date-input">
    <input type="text" placeholder="To" id="to-input">
    <button class="icon-btn" id="to-date">📅</button>
    <button class="icon-btn" id="to-time">🕐</button>
  </div>
</div>

<div class="table-wrapper">
  <table>
    <thead>
    <tr>
      <th>N</th>
      <th>Action</th>
      <th>ID</th>
      <th>상태</th>
      <th>공급사</th>
      <th>제목</th>
      <th>평가일자</th>
      <th>종합결과</th>
      <th>A/I 개수</th>
      <th>생성자</th>
      <th>생성일</th>
      <th>수정자</th>
      <th>수정일</th>
    </tr>
    </thead>

    <tbody id="audit-table-body"></tbody>
  </table>
</div>

<div class="pagination">
  <div class="page-buttons">
    <button id="audit-first-btn">|&lt;</button>
    <button id="audit-prev-btn">&lt;</button>
    <span class="page-number-list" id="audit-page-number-list"></span>
    <button id="audit-next-btn">&gt;</button>
    <button id="audit-last-btn">&gt;|</button>
  </div>

  <div class="page-size">
    <select id="audit-page-size">
      <option>10</option>
      <option selected>20</option>
      <option>50</option>
      <option>100</option>
    </select>
    items per page
  </div>

  <div class="page-total" id="audit-page-total">1 - 1 of 1 items</div>
</div>

<script src="script.js"></script>
</body>

</html>
